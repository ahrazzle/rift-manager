:root{
  /* color: surfaces */
  --bg:#0B0F15; --s1:#121822; --s2:#18202C; --s3:#1F2936;
  --line:#263040;            /* decorative dividers only */
  --line-strong:#6B788B;     /* control borders, >=3:1 on s1/s2 */
  /* color: text */
  --text:#F2F5F8; --text-2:#B4BDC9; --text-3:#8E9AA8;
  /* color: meaning (each has ONE job) */
  --primary:#F2F5F8; --on-primary:#0B0F15;          /* the one action per view */
  --blue:#5B9BFF; --blue-bg:#14243D;                /* blue side (draft/match only) */
  --red:#FF6B6B;  --red-bg:#3A181C;                 /* red side (draft/match only) */
  --win:#3DDC84;  --win-bg:#11301F;                 /* outcomes only */
  --loss:#FF8577; --loss-bg:#3A1A17;
  --warn:#FFC857;
  --gold:#F2C14E; --gold-2:#FFE3A1; --gold-bg:#2E2512; /* reward/trophy only */
  --focus:#7CC4FF;
  --team:#e2012d;                                    /* user's team color: crests & thin accents only, never text */
  /* type */
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-ui:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-12:.75rem; --fs-14:.875rem; --fs-16:1rem; --fs-18:1.125rem; --fs-20:1.25rem; --fs-24:1.5rem; --fs-32:2rem; --fs-40:2.5rem; --fs-56:3.5rem; --fs-72:4.5rem;
  /* space (4pt) */

  /* radius */

.waiting{display:flex;align-items:center;gap:var(--sp-3);color:var(--text-2)}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
/* mobile */
@media (max-width:900px){
  .mbar{padding:0 var(--sp-4);gap:var(--sp-2)}
  .board{grid-template-columns:1fr;padding:0;gap:0}
  .team{display:none}
  .strip{display:grid !important}
  .center{padding:var(--sp-3) var(--sp-4) 200px;gap:var(--sp-3)}
  .turn{padding:var(--sp-3) var(--sp-4);gap:var(--sp-3)} .turn h1{font-size:var(--fs-24)} .turn .seq{display:none}
  .pool{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tile{padding:3px} .tile .nm{font-size:var(--fs-12)} .tile .tag{display:none} .tile .rr{top:6px;right:6px;width:18px;height:18px} .tile .st{inset:3px 3px auto}
  .detail{position:fixed;left:0;right:0;bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;grid-template-columns:auto 1fr;padding:var(--sp-4) var(--sp-4) calc(var(--sp-4) + env(safe-area-inset-bottom));z-index:40;box-shadow:var(--e3)}
  .detail .acts{grid-column:1/-1} .detail .acts .btn-primary{flex:1}
  .detail .glyph{width:52px}
  .filters{display:grid;grid-template-columns:1fr;gap:var(--sp-2)}
  #roles{display:grid;grid-template-columns:repeat(6,1fr);width:100%}
  #roles button{padding:0;justify-content:center;min-height:40px}
  #roles button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #roles button svg{margin:0;width:20px;height:20px}
  .detail .meta .chip:nth-child(n+4){display:none}
  .detail{max-width:100vw}
  .detail > div{min-width:0}
}
.strip{display:none;position:sticky;top:var(--topbar);z-index:15;background:var(--bg);padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--line);gap:6px}
.strip .row{display:grid;grid-template-columns:28px repeat(5,1fr) 6px repeat(3,22px);gap:4px;align-items:center}
.strip .row{min-height:calc((100vw - 168px) / 5)}
.picks{min-height:392px}.bans{min-height:40px}.pool{min-height:60vh}.turn{min-height:88px}
.strip .sd{font-size:11px;font-weight:700;color:var(--c)}
.strip .p{aspect-ratio:1;border-radius:6px;border:1px dashed var(--line-strong);overflow:hidden;display:grid;place-items:center}
.strip .p .glyph{width:100%;height:100%;--gfs:13px;border-radius:0}
.strip .p.active{border:2px solid var(--c)}
.strip .b{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--s2);position:relative}
.strip .b .glyph{width:100%;height:100%;--gfs:9px;border-radius:0;filter:grayscale(1) brightness(.6)}
.strip .b:empty{border:1px dashed var(--line)}

<script>
// Data shapes mirror src/data/champions.js (id, name, roles, phase, styles). Glyphs are original monograms; no game art.
const CH=[["aatrox","Aatrox",["TOP"],"mid",["teamfight","engage"]],["camille","Camille",["TOP"],"late",["split","pick"]],["darius","Darius",["TOP"],"early",["engage","teamfight"]],["fiora","Fiora",["TOP"],"late",["split"]],["gnar","Gnar",["TOP"],"mid",["teamfight","engage","poke"]],["gragas","Gragas",["TOP","JNG"],"mid",["engage","pick"]],["jax","Jax",["TOP"],"late",["split","teamfight"]],["jayce","Jayce",["TOP","MID"],"early",["poke"]],["ksante","K'Sante",["TOP"],"mid",["engage","teamfight"]],["ornn","Ornn",["TOP"],"mid",["engage","teamfight"]],["renekton","Renekton",["TOP"],"early",["engage","split"]],["rumble","Rumble",["TOP","MID"],"mid",["teamfight","poke"]],["elise","Elise",["JNG"],"early",["pick","engage"]],["graves","Graves",["JNG"],"mid",["poke","teamfight"]],["jarvan","Jarvan IV",["JNG"],"early",["engage","teamfight"]],["kindred","Kindred",["JNG"],"late",["teamfight","protect"]],["leesin","Lee Sin",["JNG"],"early",["pick","engage"]],["lillia","Lillia",["JNG"],"mid",["teamfight","poke"]],["maokai","Maokai",["JNG","SUP"],"mid",["engage","teamfight"]],["nocturne","Nocturne",["JNG"],"mid",["pick","engage"]],["sejuani","Sejuani",["JNG"],"mid",["engage","teamfight"]],["viego","Viego",["JNG"],"mid",["pick","teamfight"]],["vi","Vi",["JNG"],"mid",["engage","pick"]],["wukong","Wukong",["JNG","TOP"],"mid",["engage","teamfight"]],["ahri","Ahri",["MID"],"mid",["pick","poke"]],["akali","Akali",["MID","TOP"],"mid",["pick","split"]],["azir","Azir",["MID"],"late",["teamfight","poke"]],["corki","Corki",["MID","BOT"],"mid",["poke","teamfight"]],["hwei","Hwei",["MID"],"mid",["poke","teamfight"]],["leblanc","LeBlanc",["MID"],"early",["pick","poke"]],["neeko","Neeko",["MID","SUP"],"mid",["engage","teamfight"]],["orianna","Orianna",["MID"],"mid",["teamfight","poke"]],["sylas","Sylas",["MID"],"mid",["teamfight","pick"]],["taliyah","Taliyah",["MID","JNG"],"mid",["poke","pick"]],["tristana","Tristana",["MID","BOT"],"mid",["poke","teamfight"]],["zed","Zed",["MID"],"mid",["pick","split"]],["aphelios","Aphelios",["BOT"],"late",["teamfight"]],["ashe","Ashe",["BOT","SUP"],"mid",["poke","engage"]],["caitlyn","Caitlyn",["BOT"],"early",["poke"]],["draven","Draven",["BOT"],"early",["teamfight"]],["ezreal","Ezreal",["BOT"],"mid",["poke"]],["jhin","Jhin",["BOT"],"mid",["poke","pick"]],["kaisa","Kai'Sa",["BOT"],"mid",["teamfight","pick"]],["kalista","Kalista",["BOT"],"early",["teamfight"]],["lucian","Lucian",["BOT","MID"],"early",["teamfight","poke"]],["senna","Senna",["BOT","SUP"],"late",["poke","protect"]],["varus","Varus",["BOT"],"mid",["poke","teamfight"]],["zeri","Zeri",["BOT"],"late",["teamfight"]],["alistar","Alistar",["SUP"],"mid",["engage","teamfight"]],["bard","Bard",["SUP"],"mid",["pick","poke"]],["blitzcrank","Blitzcrank",["SUP"],"early",["pick"]],["braum","Braum",["SUP"],"mid",["protect","teamfight"]],["karma","Karma",["SUP"],"early",["poke","protect"]],["leona","Leona",["SUP"],"early",["engage","teamfight"]],["lulu","Lulu",["SUP"],"mid",["protect","poke"]],["milio","Milio",["SUP"],"mid",["protect","teamfight"]],["nautilus","Nautilus",["SUP"],"early",["engage","pick"]],["rakan","Rakan",["SUP"],"mid",["engage","teamfight"]],["renata","Renata Glasc",["SUP"],"mid",["teamfight","protect"]],["thresh","Thresh",["SUP"],"mid",["pick","engage","protect"]]].map(([id,name,roles,phase,styles])=>({id,name,roles,phase,styles}));
const BY=Object.fromEntries(CH.map(c=>[c.id,c]));
const PLAYERS={B:{TOP:"Zeus",JNG:"Oner",MID:"Faker",BOT:"Gumayusi",SUP:"Keria"},R:{TOP:"Kiin",JNG:"Canyon",MID:"Chovy",BOT:"Peyz",SUP:"Lehends"}};
// Tournament draft order: 6 bans, 6 picks, 4 bans, 4 picks
const ORDER=[["B","ban"],["R","ban"],["B","ban"],["R","ban"],["B","ban"],["R","ban"],["B","pick"],["R","pick"],["R","pick"],["B","pick"],["B","pick"],["R","pick"],["R","ban"],["B","ban"],["R","ban"],["B","ban"],["R","pick"],["B","pick"],["B","pick"],["R","pick"]];
const S={step:0,bans:{B:[],R:[]},picks:{B:[],R:[]},sel:null,role:"ALL",q:"",just:null};
// Seed to the "your pick" moment shown in the brief: bans done, B1 + R1/R2 locked.
[["azir"],["leesin"],["kalista"],["jayce"],["rakan"],["aphelios"]].forEach(([id],i)=>S.bans[ORDER[i][0]].push(id));
S.picks.B.push({id:"ksante",role:"TOP"});S.picks.R.push({id:"vi",role:"JNG"},{id:"corki",role:"MID"});S.step=9;
const hue=id=>{let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%360;return h};
const mono=n=>n.replace(/[^A-Za-z ]/g,"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()+(n.split(" ").length>1?"":n.replace(/[^a-z]/g,"")[0]||"");
const glyph=(c,extra="")=>`<span class="glyph" style="--h:${hue(c.id)}" ${extra}><span>${mono(c.name).slice(0,2)}</span></span>`;
const used=()=>new Set([...S.bans.B,...S.bans.R,...S.picks.B.map(p=>p.id),...S.picks.R.map(p=>p.id)]);
const openRole=side=>["TOP","JNG","MID","BOT","SUP"].filter(r=>!S.picks[side].some(p=>p.role===r));
const cur=()=>ORDER[S.step];
const $=id=>document.getElementById(id);
function renderSide(side){
  const bans=$(side==="B"?"bb":"br"),picks=$(side==="B"?"pb":"pr");
  bans.innerHTML=[0,1,2,3,4].map(i=>{const id=S.bans[side][i];const c=id&&BY[id];return `<div class="ban ${c?"filled":""}" title="${c?c.name+" (banned)":"Ban "+(i+1)}">${c?glyph(c):'<svg style="width:16px;height:16px" aria-hidden="true"><use href="#i-ban"/></svg>'}<span class="sr-only">${c?c.name+" banned":"Ban "+(i+1)+" open"}</span></div>`}).join("");
  const [cs,ct]=cur()||[];const pickIdx=S.picks[side].length;
  picks.innerHTML=[0,1,2,3,4].map(i=>{const p=S.picks[side][i];const c=p&&BY[p.id];const active=!p&&cs===side&&ct==="pick"&&i===pickIdx;const role=p?p.role:null;
    return `<li class="slot ${active?"active":""} ${p?"locked":""} ${S.just===p?.id?"just":""}"><span class="ph">${c?glyph(c):'<svg aria-hidden="true"><use href="#i-search"/></svg>'}</span><span class="who"><small>Pick ${i+1}${active?" · now":""}</small><b>${c?c.name:(active?"Choosing…":"—")}</b><span>${role?PLAYERS[side][role]+" · "+role:""}</span></span></li>`}).join("");
  const row=$(side==="B"?"sb":"sr");
  row.innerHTML=`<span class="sd">${side==="B"?"T1":"GEN"}</span>`+[0,1,2,3,4].map(i=>{const p=S.picks[side][i];const active=!p&&cs===side&&ct==="pick"&&i===pickIdx;return `<span class="p ${active?"active":""}">${p?glyph(BY[p.id]):""}</span>`}).join("")+'<span></span>'+[0,1,2].map(i=>{const id=S.bans[side][i];return `<span class="b">${id?glyph(BY[id]):""}</span>`}).join("");
}
function renderTurn(){
  const t=cur();const el=$("turn");
  const seq=ORDER.map(([s,k],i)=>`<i class="${s==="B"?"b":"r"} ${k==="ban"?"ban":""} ${i<S.step?"done":""} ${i===S.step?"now":""}" title="${s==="B"?"T1":"GEN"} ${k}"></i>`).join("");
  if(!t){el.className="turn";el.style.setProperty("--c","var(--win)");el.innerHTML=`<div><h1>Draft complete</h1><p>Both comps are locked. Take them onto the Rift.</p></div><a class="btn btn-primary" href="match.html" style="margin-left:auto">Start game 1</a>`;return}
  const [s,k]=t;const you=s==="B";const n=ORDER.slice(0,S.step+1).filter(x=>x[1]===k&&x[0]===s).length;
  el.className="turn "+(you?"blue":"red");
  el.innerHTML=you?`<div><h1>Your ${k} · ${k==="pick"?"Pick":"Ban"} ${n} of 5</h1><p>${k==="pick"?"Open roles: "+openRole("B").join(" · ")+". GEN have "+S.picks.R.map(p=>BY[p.id].name).join(" + ")+".":"Remove a threat from the pool."}</p></div><div class="seq" aria-hidden="true">${seq}</div>`
    :`<div><h1>GEN ${k==="pick"?"picking":"banning"}</h1><p class="waiting"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>Their coach is deciding.</p></div><div class="seq" aria-hidden="true">${seq}</div>`;
}
function renderPool(){
  const u=used();const t=cur();const yours=t&&t[0]==="B";
  const list=CH.filter(c=>(S.role==="ALL"||c.roles.includes(S.role))&&c.name.toLowerCase().includes(S.q));
  $("pool").innerHTML=list.length?list.map(c=>{const dis=u.has(c.id);const st=S.bans.B.includes(c.id)||S.bans.R.includes(c.id)?"Banned":dis?"Picked":"";
    return `<button class="tile" data-id="${c.id}" aria-pressed="${S.sel===c.id}" ${dis||!yours?"disabled":""}>${glyph(c,'aria-hidden="true"')}<span class="tag" aria-hidden="true">${c.phase}</span><span class="rr" aria-hidden="true"><svg><use href="#role-${c.roles[0]}"/></svg></span>${st?`<span class="st" aria-hidden="true">${st}</span>`:""}<span class="nm">${c.name}</span><span class="sr-only">, ${c.roles.join(" and ")}, ${c.phase} game${st?", "+st:""}</span></button>`}).join("")
    :`<p class="empty" style="grid-column:1/-1">No champion matches “${S.q}”. Clear the search or pick another role.</p>`;
}
function fit(c){const mine=S.picks.B.map(p=>BY[p.id]);const counts={};mine.forEach(m=>m.styles.forEach(s=>counts[s]=(counts[s]||0)+1));const add=c.styles.filter(s=>!counts[s]);return add.length?`Adds ${add.join(" + ")} to your comp.`:`Doubles down on ${c.styles[0]}.`}
function renderDetail(){
  const t=cur();const el=$("detail");
  if(!t||t[0]!=="B"){el.hidden=true;return}el.hidden=false;
  const c=S.sel&&BY[S.sel];
  if(!c){el.innerHTML=`<span class="glyph" style="--h:220;filter:grayscale(1);opacity:.4"><span>?</span></span><div><h2>Select a champion</h2><p class="fit">Tap a tile to see its fit, then lock it in.</p></div><div class="acts"><button class="btn btn-primary" disabled>${t[1]==="pick"?"Lock in":"Ban"}</button></div>`;return}
  const roles=t[1]==="pick"?c.roles.filter(r=>openRole("B").includes(r)):[];const role=roles[0]||openRole("B")[0];
  el.innerHTML=`${glyph(c)}<div><h2>${c.name}</h2><div class="meta">${c.roles.map(r=>`<span class="chip"><svg aria-hidden="true"><use href="#role-${r}"/></svg>${r}</span>`).join("")}<span class="chip">${c.phase} game</span>${c.styles.map(s=>`<span class="chip">${s}</span>`).join("")}</div>${t[1]==="pick"?`<p class="fit">${fit(c)} Goes to <b>${PLAYERS.B[role]}</b> (${role}).</p>`:""}</div>
  <div class="acts">${t[1]==="pick"&&openRole("B").length>1?`<label class="sr-only" for="rp">Role</label><select class="select rolepick" id="rp">${openRole("B").map(r=>`<option ${r===role?"selected":""}>${r}</option>`).join("")}</select>`:""}<button class="btn btn-primary" id="lock">${t[1]==="pick"?"Lock in "+c.name:"Ban "+c.name}</button></div>`;
  $("lock").onclick=()=>{const r=$("rp")?.value||role;commit("B",t[1],c.id,r)};
}
function commit(side,kind,id,role){
  if(kind==="ban")S.bans[side].push(id);else S.picks[side].push({id,role});
  S.just=id;S.sel=null;S.step++;render();
  if(cur()&&cur()[0]==="R")setTimeout(ai,document.documentElement.dataset.fast?50:900);
}
function ai(){const t=cur();if(!t||t[0]!=="R")return;const u=used();
  if(t[1]==="ban"){const c=CH.find(c=>!u.has(c.id)&&c.phase==="late");commit("R","ban",c.id)}
  else{const r=openRole("R")[0];const c=CH.find(c=>!u.has(c.id)&&c.roles[0]===r)||CH.find(c=>!u.has(c.id));commit("R","pick",c.id,r)}}
function render(){renderSide("B");renderSide("R");renderTurn();renderPool();renderDetail()}
$("pool").addEventListener("click",e=>{const b=e.target.closest(".tile");if(!b||b.disabled)return;S.sel=b.dataset.id;S.just=null;renderPool();renderDetail();document.querySelector(`.tile[data-id="${S.sel}"]`)?.focus()});
$("roles").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.role=b.dataset.r;[...$("roles").children].forEach(x=>x.setAttribute("aria-pressed",x===b));renderPool()});
$("q").addEventListener("input",e=>{S.q=e.target.value.toLowerCase().trim();renderPool()});
$("auto").onclick=()=>{document.documentElement.dataset.fast=1;const loop=()=>{const t=cur();if(!t)return;if(t[0]==="R"){ai()}else{const u=used();const r=openRole("B")[0];const c=t[1]==="ban"?CH.find(c=>!u.has(c.id)):(CH.find(c=>!u.has(c.id)&&c.roles[0]===r));commit("B",t[1],c.id,r)}setTimeout(loop,60)};loop()};
// Preselect Orianna so the detail sheet is shown in the static capture
S.sel="orianna";render();
</script>
</body></html>
