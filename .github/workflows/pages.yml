name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify dist
        run: |
          test -f dist/CNAME || { echo "dist/CNAME missing"; exit 1; }
          test -f dist/.nojekyll || { echo "dist/.nojekyll missing"; exit 1; }
          grep -q '\./assets/' dist/index.html || { echo "dist/index.html does not reference ./assets/"; exit 1; }
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: "Deploy ${{ github.sha }} to GitHub Pages"
